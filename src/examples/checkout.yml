description: >
  Check out the pipeline's commit in a UBI 9 image with an ECDSA key from the project's
  additional SSH keys, so the checkout works with FIPS mode on.
usage:
  version: 2.1
  orbs:
    corecci: juburr/corecci@1.0.0
  jobs:
    ubi9_fips_job:
      docker:
        - image: registry.access.redhat.com/ubi9/ubi
      resource_class: small
      steps:
        - corecci/checkout:
            depth: shallow
            fingerprint: "SHA256:1wS2Fom3QTXyH5G2DS88+II0U9ajqGKOeq1wBA740Fc"
            submodules: recursive-shallow
  workflows:
    use-my-orb:
      jobs:
        - ubi9_fips_job
